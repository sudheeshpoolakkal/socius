<svg width="400" height="225" viewBox="0 0 400 225" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="bgDefault" x1="0" y1="0" x2="400" y2="225" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B8D4E3"/>
      <stop offset="100%" stop-color="#8FB7CD"/>
    </linearGradient>
    <radialGradient id="glowDefault" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8FB7CD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="snowflake" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D4F1F9"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="225" fill="url(#bgDefault)"/>
  
  <!-- Decorative glow -->
  <circle cx="200" cy="112" r="150" fill="url(#glowDefault)" opacity="0.5"/>
  
  <!-- Snowflake -->
  <g transform="translate(200, 112)">
    <!-- Main lines -->
    <line x1="0" y1="-50" x2="0" y2="50" stroke="url(#snowflake)" stroke-width="4" stroke-linecap="round"/>
    <line x1="-50" y1="0" x2="50" y2="0" stroke="url(#snowflake)" stroke-width="4" stroke-linecap="round"/>
    <line x1="-35" y1="-35" x2="35" y2="35" stroke="url(#snowflake)" stroke-width="4" stroke-linecap="round"/>
    <line x1="35" y1="-35" x2="-35" y2="35" stroke="url(#snowflake)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Branch details -->
    <g opacity="0.9">
      <line x1="0" y1="-50" x2="-10" y2="-40" stroke="url(#snowflake)" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="-50" x2="10" y2="-40" stroke="url(#snowflake)" stroke-width="3" stroke-linecap="round"/>
      
      <line x1="0" y1="50" x2="-10" y2="40" stroke="url(#snowflake)" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="50" x2="10" y2="40" stroke="url(#snowflake)" stroke-width="3" stroke-linecap="round"/>
      
      <line x1="-50" y1="0" x2="-40" y2="-10" stroke="url(#snowflake)" stroke-width="3" stroke-linecap="round"/>
      <line x1="-50" y1="0" x2="-40" y2="10" stroke="url(#snowflake)" stroke-width="3" stroke-linecap="round"/>
      
      <line x1="50" y1="0" x2="40" y2="-10" stroke="url(#snowflake)" stroke-width="3" stroke-linecap="round"/>
      <line x1="50" y1="0" x2="40" y2="10" stroke="url(#snowflake)" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <!-- Center circle -->
    <circle cx="0" cy="0" r="12" fill="url(#snowflake)" opacity="0.9"/>
    <circle cx="0" cy="0" r="8" fill="#A9D6E5" opacity="0.8"/>
  </g>
  
  <!-- Smaller decorative snowflakes -->
  <g opacity="0.5">
    <circle cx="70" cy="50" r="3" fill="#FFFFFF"/>
    <circle cx="330" cy="180" r="4" fill="#FFFFFF"/>
    <circle cx="100" cy="170" r="2.5" fill="#FFFFFF"/>
    <circle cx="310" cy="60" r="3.5" fill="#FFFFFF"/>
  </g>
  
  <!-- Bottom Text Area -->
  <text x="200" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">
    Arendelle Academy
  </text>
</svg>
