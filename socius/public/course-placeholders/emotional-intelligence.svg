<svg width="400" height="225" viewBox="0 0 400 225" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="400" y2="225" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A9D6E5"/>
      <stop offset="50%" stop-color="#89B5C9"/>
      <stop offset="100%" stop-color="#6B9AB8"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD6E8"/>
      <stop offset="100%" stop-color="#FFADD2"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#A9D6E5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="225" fill="url(#bg1)"/>
  
  <!-- Decorative Circles -->
  <circle cx="350" cy="30" r="60" fill="url(#glow1)" opacity="0.6"/>
  <circle cx="50" cy="180" r="80" fill="url(#glow1)" opacity="0.4"/>
  
  <!-- Heart Icon -->
  <g transform="translate(200, 112.5)">
    <path d="M0,-25 C-15,-40 -35,-40 -45,-25 C-55,-10 -55,10 -35,30 L0,55 L35,30 C55,10 55,-10 45,-25 C35,-40 15,-40 0,-25 Z" 
          fill="url(#accent1)" opacity="0.9" stroke="#FFFFFF" stroke-width="3"/>
    
    <!-- Sparkles -->
    <circle cx="-30" cy="-15" r="3" fill="#FFFFFF"/>
    <circle cx="35" cy="-10" r="2" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="20" cy="35" r="2.5" fill="#FFFFFF"/>
  </g>
  
  <!-- Bottom Text Area -->
  <text x="200" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">
    Emotional Intelligence
  </text>
</svg>
