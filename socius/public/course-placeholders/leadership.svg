<svg width="400" height="225" viewBox="0 0 400 225" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="400" y2="225" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7B9FAB"/>
      <stop offset="50%" stop-color="#5B8291"/>
      <stop offset="100%" stop-color="#3F6876"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3F6876" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="225" fill="url(#bg2)"/>
  
  <!-- Decorative Elements -->
  <circle cx="80" cy="50" r="70" fill="url(#glow2)" opacity="0.5"/>
  <circle cx="330" cy="170" r="90" fill="url(#glow2)" opacity="0.3"/>
  
  <!-- Crown/Leadership Icon -->
  <g transform="translate(200, 100)">
    <!-- Crown -->
    <path d="M-40,20 L-30,-15 L-10,5 L10,-20 L30,5 L40,-15 L40,30 L-40,30 Z" 
          fill="url(#accent2)" opacity="0.95" stroke="#FFFFFF" stroke-width="2.5"/>
    
    <!-- Jewels -->
    <circle cx="-30" cy="-15" r="4" fill="#FF6B6B"/>
    <circle cx="0" cy="-5" r="5" fill="#4ECDC4"/>
    <circle cx="30" cy="-15" r="4" fill="#95E1D3"/>
    
    <!-- Crown base decoration -->
    <rect x="-40" y="28" width="80" height="8" fill="url(#accent2)" opacity="0.8" rx="2"/>
  </g>
  
  <!-- Mountain peaks in background -->
  <path d="M0,225 L100,130 L200,180 L300,100 L400,160 L400,225 Z" fill="#2F4F5F" opacity="0.3"/>
  
  <!-- Bottom Text Area -->
  <text x="200" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">
    Visionary Leadership
  </text>
</svg>
