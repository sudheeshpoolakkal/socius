<svg width="400" height="225" viewBox="0 0 400 225" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="400" y2="225" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4A5D8"/>
      <stop offset="50%" stop-color="#B88BC2"/>
      <stop offset="100%" stop-color="#9C71AC"/>
    </linearGradient>
    <linearGradient id="palette1" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE66D"/>
      <stop offset="50%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#4ECDC4"/>
    </linearGradient>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow5" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#9C71AC" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="225" fill="url(#bg5)"/>
  
  <!-- Glow effects -->
  <circle cx="200" cy="112" r="100" fill="url(#glow5)" opacity="0.6"/>
  
  <!-- Lightbulb -->
  <g transform="translate(200, 100)">
    <!-- Bulb -->
    <ellipse cx="0" cy="0" rx="35" ry="45" fill="url(#palette1)" opacity="0.9" stroke="#FFFFFF" stroke-width="3"/>
    
    <!-- Base -->
    <rect x="-20" y="38" width="40" height="8" fill="#E8E8E8" stroke="#FFFFFF" stroke-width="2" rx="2"/>
    <rect x="-18" y="46" width="36" height="6" fill="#D0D0D0" stroke="#FFFFFF" stroke-width="2" rx="1"/>
    <rect x="-16" y="52" width="32" height="6" fill="#E8E8E8" stroke="#FFFFFF" stroke-width="2" rx="1"/>
    
    <!-- Sparkles -->
    <g opacity="0.9">
      <circle cx="-45" cy="-20" r="4" fill="url(#spark)"/>
      <circle cx="45" cy="-15" r="5" fill="url(#spark)"/>
      <circle cx="-35" cy="20" r="3" fill="url(#spark)"/>
      <circle cx="40" cy="15" r="4" fill="url(#spark)"/>
      
      <!-- Stars -->
      <path d="M-50,-35 L-48,-30 L-45,-32 L-47,-28 L-45,-23 L-50,-26 L-55,-23 L-53,-28 L-55,-32 L-52,-30 Z" 
            fill="#FFD700"/>
      <path d="M50,-30 L52,-26 L54,-28 L53,-23 L57,-21 L52,-20 L50,-15 L48,-20 L43,-21 L47,-23 Z" 
            fill="#4ECDC4"/>
    </g>
    
    <!-- Inner glow -->
    <ellipse cx="0" cy="-5" rx="20" ry="25" fill="#FFFFFF" opacity="0.4"/>
  </g>
  
  <!-- Paint splashes -->
  <circle cx="80" cy="60" r="8" fill="#FF6B6B" opacity="0.7"/>
  <circle cx="320" cy="170" r="10" fill="#4ECDC4" opacity="0.7"/>
  <circle cx="110" cy="180" r="6" fill="#FFE66D" opacity="0.7"/>
  
  <!-- Bottom Text Area -->
  <text x="200" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">
    Creative Alchemy
  </text>
</svg>
